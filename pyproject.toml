[tool.poetry]
name = "opensesame-extension-sigmund"
version = "1.7.0"
description = "SigmundAI copilot extension for OpenSesame and Sigmund Analyst"
authors = ["Sebastiaan Mathôt <s.mathot@cogsci.nl>"]
readme = "readme.md"
packages = [
    {include = "opensesame_extensions"},
    {include = "sigmund_qtwidget"}
]
license = "COPYING"
homepage = "https://osdoc.cogsci.nl"
repository = "https://github.com/open-cogsci/opensesame-extension-sigmund"

[tool.poetry.dependencies]
websockets = ">= 10"
pyqt_code_editor = ">= 1.5.0"
opensesame-core = ">= 4.1.24"
jinja2 = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
